plugins {
    id "application"
    id "maven-publish"
    alias(libs.plugins.th2.publish)
    alias(libs.plugins.th2.component)
}

group = 'com.exactpro.th2'
version = release_version

repositories {
    mavenCentral()
    maven {
        name 'Sonatype_releases'
        url 'https://s01.oss.sonatype.org/content/repositories/releases/'
    }
    mavenLocal()

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

dependencies {
    implementation(libs.th2.common) {
        exclude group: 'com.exactpro.th2', module: 'cradle-core'
        exclude group: 'com.exactpro.th2', module: 'cradle-cassandra'
    }
    implementation(libs.th2.common.utils) {
        because("executor service utils is used")
    }
    implementation(libs.th2.task.utils)
    implementation(libs.cradle.core)
    implementation(libs.cradle.cassandra)

    // FIXME: Added as API dependency to common com.exactpro.th2.common.event.Event.toProto(...) throws `JsonProcessingException`
    implementation 'com.fasterxml.jackson.core:jackson-core'

    implementation 'io.prometheus:simpleclient'
    implementation "org.slf4j:slf4j-api"
    implementation "org.jetbrains:annotations"

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310') {
        because("Error collector serialise Instant values")
    }

    testImplementation 'org.apache.commons:commons-lang3'
    testImplementation(libs.junit.jupiter)
    testImplementation(libs.mockito.junit.jupiter)
    testImplementation(libs.th2.junit.jupiter.integration) {
        because("integration tests with RabbitMQ")
    }
    testImplementation(libs.amqp.client) {
        because("integration tests check RabbitMQ queue state")
    }
    testRuntimeOnly('org.junit.platform:junit-platform-launcher') {
        because 'This artifact will not be added automatically since gradle 9.0. You can read more information here:' +
                'https://docs.gradle.org/8.3/userguide/upgrading_version_8.html#test_framework_implementation_dependencies'
    }
}

dependencies { // Vulnerability fixes of transitive dependencies
    implementation(platform(libs.netty.bom)) {
        because("CVE-2026-45674, CVE-2026-47691, CVE-2026-56820, CVE-2026-75595 and other vulnerabilities fixed in 4.2.17.Final+")
    }
    implementation(platform(libs.jackson.bom)) {
        because("CVE-2026-54512, CVE-2026-54513, CVE-2026-54515, CVE-2026-77310 and other vulnerabilities fixed in 2.21.5+")
    }
    implementation(platform(libs.kotlin.bom)) {
        because("CVE-2026-53914 fixed in 2.4.20+, CVE-2020-29582 fixed in 2.1.0+")
    }
    implementation(platform(libs.log4j.bom)) {
        because("CVE-2026-34477, CVE-2026-34478, CVE-2026-34479, CVE-2026-34480, CVE-2026-49844 fixed in 2.25.5+")
    }
    implementation(platform(libs.asm.bom)) {
        because("CVE-2026-110270, CVE-2026-110262, CVE-2026-110591 fixed in 9.11+")
    }

    constraints {
        implementation(libs.amqp.client) {
            because("CVE-2026-69220, CVE-2026-63337, CVE-2026-106121, CVE-2026-106122 and other vulnerabilities fixed in 5.33.1+")
        }
        implementation(libs.guava) {
            because("CVE-2026-102554 fixed in 33.7.2-jre+")
        }
        implementation(libs.lz4.java) {
            because("CVE-2026-106451, CVE-2026-106450, CVE-2026-106452, CVE-2026-106453, CVE-2026-59949 fixed in 1.11.4+")
        }
        implementation(libs.vertx.core) {
            because("CVE-2026-15075, CVE-2026-15076, CVE-2026-6860 fixed in 4.5.30+")
        }
        implementation(libs.vertx.auth.common) {
            because("CVE-2026-15075, CVE-2026-15076, CVE-2026-6860 fixed in 4.5.30+")
        }
        implementation(libs.vertx.web.client) {
            because("CVE-2026-15076 fixed in 4.5.30+")
        }
        implementation(libs.vertx.web.common) {
            because("vertx modules should have the same version")
        }
    }
}

application {
    mainClassName 'com.exactpro.th2.estore.EventStore'
}

test {
    useJUnitPlatform {
        excludeTags('integration-test')
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs integration tests, requires docker'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags('integration-test')
    }
}

dependencyCheck {
    suppressionFile='suppressions.xml'
}